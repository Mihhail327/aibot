# Продакшн конфигурация Docker Compose (Production-Ready)
x-app-base: &app-base
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - .env
  environment:
    - POSTGRES_HOST=db
    - REDIS_HOST=redis
  volumes:
    - ./app:/app/app
    - ./alembic:/app/alembic
    - ./media:/app/media

  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  # === INFRASTRUCTURE LAYER ===
  db:
    image: postgres:15.5-alpine
    container_name: aibot_postgres_prod
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2.3-alpine
    container_name: aibot_redis_prod
    restart: unless-stopped
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # === APPLICATION LAYER ===
  api:
    <<: *app-base
    container_name: aibot_api_prod
    ports:
      - "8000:8000"
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4"

  celery_worker:
    <<: *app-base
    container_name: aibot_worker_prod
    command: celery -A app.core.celery_app worker -l INFO --pool=threads --concurrency=10 -E

  celery_beat:
    <<: *app-base
    container_name: aibot_beat_prod
    command: celery -A app.core.celery_app beat -l INFO

  # === MONITORING LAYER ===
  flower:
    image: mher/flower:2.0.1
    container_name: aibot_flower_prod
    restart: unless-stopped
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/1
      - BASIC_AUTH=${FLOWER_BASIC_AUTH:-admin:change_me_in_prod}
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
      celery_worker:
        condition: service_started

volumes:
  postgres_data_prod:
  redis_data_prod:
