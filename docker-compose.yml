# Базовый шаблон для всех Python-сервисов (DRY)
x-app-base: &app-base
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - .env
  # Переопределяем хосты для корректного разрешения DNS внутри Docker-сети
  environment:
    - POSTGRES_HOST=db
    - REDIS_HOST=redis
  volumes:
    - ./app:/app/app
    - ./alembic:/app/alembic
    - ./media:/app/media

  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  # === INFRASTRUCTURE LAYER ===
  db:
    image: postgres:15.5-alpine
    container_name: aibot_postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2.3-alpine
    container_name: aibot_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # === APPLICATION LAYER ===
  api:
    <<: *app-base
    container_name: aibot_api
    ports:
      - "8000:8000"
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  celery_worker:
    <<: *app-base
    container_name: aibot_worker
    # Добавляем флаг -E для мониторинга задач в реальном времени через Flower
    command: celery -A app.core.celery_app worker -l INFO --pool=threads --concurrency=10 -E

  celery_beat:
    <<: *app-base
    container_name: aibot_beat
    command: celery -A app.core.celery_app beat -l INFO

  # === MONITORING LAYER ===
  flower:
    image: mher/flower:2.0.1
    container_name: aibot_flower
    restart: unless-stopped
    environment:
      # Явное подключение с использованием внутреннего DNS Docker (redis)
      - CELERY_BROKER_URL=redis://redis:6379/1
      - BASIC_AUTH=${FLOWER_BASIC_AUTH:-}
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
      celery_worker:
        condition: service_started

volumes:
  postgres_data:
  redis_data: